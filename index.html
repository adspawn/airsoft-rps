<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d0a">
<title>RPS Meter</title>
<meta name="description" content="エアソフトガンの発射音を録音し、波形のピーク間隔から発射サイクル（発/秒）を測定します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d0a; --panel:#0f140f; --grid:rgba(124,255,107,.07); --line:#2a3a26;
  --fg:#b8f5a8; --hi:#7cff6b; --dim:#4f6b47; --amber:#ffb627; --red:#ff4b3e;
  --mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
  --disp:"Orbitron","Share Tech Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);
  overflow:hidden;user-select:none;-webkit-user-select:none}
/* 背景グリッドと走査線 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,
    radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55) 100%);}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);}

.app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 112px)}

/* 上部ステータス */
.top{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;letter-spacing:.14em;color:var(--dim)}
.top .id{color:var(--fg)}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:middle}
.led.on{background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1s steps(2) infinite}
.led.ok{background:var(--hi);box-shadow:0 0 8px var(--hi)}
@keyframes blink{50%{opacity:.25}}

/* 中央 */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0;
  max-width:820px;width:100%;margin:0 auto}
.frame{position:relative;border:1px solid var(--line);background:rgba(15,20,15,.75);padding:14px 16px}
.frame::before,.frame::after,.frame>i::before,.frame>i::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--hi)}
.frame::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.frame::after{top:-2px;right:-2px;border-left:0;border-bottom:0}
.frame>i::before{bottom:-2px;left:-2px;border-right:0;border-top:0}
.frame>i::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.label{font-size:.68rem;letter-spacing:.22em;color:var(--dim);display:flex;justify-content:space-between}

.readout{text-align:center}
.rps{font-family:var(--disp);font-weight:900;font-size:clamp(4.5rem,24vw,9rem);line-height:1;
  color:var(--hi);text-shadow:0 0 18px rgba(124,255,107,.45);font-variant-numeric:tabular-nums;margin:6px 0 2px;letter-spacing:.02em}
.rps.idle{color:var(--dim);text-shadow:none}
.unit{font-family:var(--disp);font-size:.95rem;letter-spacing:.3em;color:var(--fg)}
.unit small{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;color:var(--dim);margin-top:4px}
.sub{display:flex;justify-content:center;gap:22px;margin-top:12px;font-size:.78rem;letter-spacing:.12em;color:var(--dim)}
.sub b{color:var(--amber);font-weight:400;font-size:1rem}

canvas{display:block;width:100%;height:clamp(120px,26vh,220px)}

/* 下部固定ボタン */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:2;
  padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(to top,var(--bg) 70%,rgba(10,13,10,0));
  display:flex;justify-content:center;gap:12px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  font-family:var(--disp);font-weight:700;font-size:.9rem;letter-spacing:.16em;
  height:68px;flex:1;max-width:220px;display:flex;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  transition:background .12s,color .12s,border-color .12s}
.btn svg{width:22px;height:22px;flex:none}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.3;cursor:default}
.btn.rec{border-color:var(--hi);color:var(--hi)}
.btn.rec:not(:disabled):hover{background:rgba(124,255,107,.08)}
.btn.rec.active{background:var(--red);border-color:var(--red);color:#0a0d0a}
.btn.stop{border-color:var(--amber);color:var(--amber)}
.btn.stop:not(:disabled):hover{background:rgba(255,182,39,.08)}
.btn.reset{flex:0 0 68px;max-width:68px}
.btn.reset:hover{color:var(--hi);border-color:var(--hi)}
.btn:focus-visible{outline:2px solid var(--hi);outline-offset:3px}
@media (max-width:380px){.btn{font-size:.78rem;letter-spacing:.1em}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="id">RPS-METER // MK.1</span>
    <span><span class="led" id="led"></span><span id="status">STANDBY</span></span>
  </div>

  <div class="center">
    <div class="frame readout"><i></i>
      <div class="label"><span>CYCLE RATE</span><span id="clock">T+00.0s</span></div>
      <div class="rps idle" id="rps">--.-</div>
      <div class="unit">発 / 秒<small>ROUNDS PER SECOND</small></div>
      <div class="sub">
        <span>RPM <b id="rpm">----</b></span>
        <span>SHOTS <b id="shots">--</b></span>
      </div>
    </div>

    <div class="frame"><i></i>
      <div class="label"><span>WAVEFORM</span><span id="wlabel">NO SIGNAL</span></div>
      <canvas id="wave"></canvas>
    </div>
  </div>
</div>

<div class="bar">
  <button class="btn rec" id="recBtn" aria-label="測定">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>測定
  </button>
  <button class="btn stop" id="stopBtn" aria-label="停止" disabled>
    <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" fill="currentColor"/></svg>停止
  </button>
  <button class="btn reset" id="resetBtn" aria-label="リセット" title="リセット">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 3v5h5"/></svg>
  </button>
</div>

<script>
const $ = s => document.querySelector(s);
// 検出パラメータ（固定）
const THR = 0.35, REARM = 0.6, MIN_GAP = 0.015, HP_HZ = 1000;

let audioCtx = null, stream = null, mediaRec = null, chunks = [];
let analyser = null, liveRAF = 0, recStart = 0, clockTimer = null;
let env = null, envSR = 0, envMax = 0, dur = 0, peaks = [], burst = null, thrAbs = 0;
let liveBuf = null, liveHist = [];

function ctxGet(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function setStatus(txt, led){ $('#status').textContent = txt; $('#led').className = 'led' + (led ? ' ' + led : ''); }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ---------- 測定 ---------- */
$('#recBtn').onclick = async () => {
  if(mediaRec && mediaRec.state === 'recording') return;
  const ctx = ctxGet();
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1}});
  }catch(e){ setStatus('MIC ERROR'); return; }
  clearResult();
  chunks = [];
  try{ mediaRec = new MediaRecorder(stream, {audioBitsPerSecond:256000}); }
  catch(e){ mediaRec = new MediaRecorder(stream); }
  mediaRec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  mediaRec.onstop = onStopped;
  const src = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser(); analyser.fftSize = 2048; src.connect(analyser);
  liveBuf = new Float32Array(analyser.fftSize); liveHist = [];
  mediaRec.start();
  recStart = performance.now();
  $('#recBtn').classList.add('active'); $('#recBtn').disabled = true; $('#stopBtn').disabled = false;
  setStatus('RECORDING', 'on'); $('#wlabel').textContent = 'LIVE';
  clockTimer = setInterval(() => $('#clock').textContent = 'T+' + ((performance.now() - recStart) / 1000).toFixed(1).padStart(4, '0') + 's', 100);
  liveLoop();
};

$('#stopBtn').onclick = () => { if(mediaRec && mediaRec.state === 'recording') mediaRec.stop(); };

function stopInputs(){
  clearInterval(clockTimer); cancelAnimationFrame(liveRAF);
  if(stream) stream.getTracks().forEach(t => t.stop());
  $('#recBtn').classList.remove('active'); $('#recBtn').disabled = false; $('#stopBtn').disabled = true;
}

async function onStopped(){
  stopInputs();
  setStatus('ANALYZING');
  const blob = new Blob(chunks, {type: mediaRec.mimeType || 'audio/webm'});
  let buffer;
  try{
    const ab = await blob.arrayBuffer();
    buffer = await new Promise((res, rej) => { const p = ctxGet().decodeAudioData(ab, res, rej); if(p && p.then) p.then(res, rej); });
  }catch(e){ setStatus('DECODE ERROR'); return; }
  analyzeBuffer(buffer);
}

/* ---------- リセット ---------- */
$('#resetBtn').onclick = () => {
  if(mediaRec && mediaRec.state === 'recording'){ mediaRec.onstop = null; mediaRec.stop(); }
  stopInputs();
  clearResult();
  setStatus('STANDBY');
};

function clearResult(){
  env = null; peaks = []; burst = null; liveHist = [];
  $('#rps').textContent = '--.-'; $('#rps').classList.add('idle');
  $('#rpm').textContent = '----'; $('#shots').textContent = '--';
  $('#clock').textContent = 'T+00.0s'; $('#wlabel').textContent = 'NO SIGNAL';
  drawWave();
}

/* ---------- 解析 ---------- */
function median(a){ const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

function analyzeBuffer(buffer){
  const sr = buffer.sampleRate, n = buffer.length, ch = buffer.numberOfChannels;
  const mono = new Float32Array(n);
  for(let c = 0; c < ch; c++){ const d = buffer.getChannelData(c); for(let i = 0; i < n; i++) mono[i] += d[i] / ch; }
  dur = buffer.duration;
  // エンベロープ（1kHzハイパス → 約0.125ms刻みピーク → 0.5ms移動平均）
  const win = Math.max(1, Math.round(sr / 8000)), m = Math.floor(n / win);
  const raw = new Float32Array(m); envSR = sr / win;
  const rc = 1 / (2 * Math.PI * HP_HZ), a = rc / (rc + 1 / sr);
  let px = 0, py = 0;
  for(let k = 0; k < m; k++){
    let mx = 0;
    for(let j = k * win, e = j + win; j < e; j++){
      const y = a * (py + mono[j] - px); px = mono[j]; py = y;
      const av = y < 0 ? -y : y; if(av > mx) mx = av;
    }
    raw[k] = mx;
  }
  const w = Math.max(1, Math.round(envSR * 0.0005)); env = new Float32Array(m); let acc = 0; envMax = 0;
  for(let i = 0; i < m; i++){ acc += raw[i]; if(i >= w) acc -= raw[i - w]; env[i] = acc / Math.min(i + 1, w); if(env[i] > envMax) envMax = env[i]; }
  // ピーク検出
  thrAbs = envMax * THR;
  const rearm = thrAbs * REARM, gap = Math.round(MIN_GAP * envSR);
  peaks = []; let last = -Infinity, armed = true;
  for(let i = 0; i < m; i++){
    const v = env[i];
    if(v < rearm) armed = true;
    if(armed && v >= thrAbs && i - last >= gap){
      let t = i; if(i > 0 && env[i - 1] < thrAbs) t = i - 1 + (thrAbs - env[i - 1]) / (v - env[i - 1]);
      peaks.push(t / envSR); last = i; armed = false;
    }
  }
  // 連射区間：間隔が中央値×2.5（最低120ms）を超えたら区切り、最長の塊を採用
  burst = null;
  if(peaks.length >= 2){
    const all = []; for(let i = 1; i < peaks.length; i++) all.push(peaks[i] - peaks[i - 1]);
    const limit = Math.max(median(all) * 2.5, 0.12);
    let s = 0;
    for(let i = 1; i <= peaks.length; i++){
      if(i === peaks.length || peaks[i] - peaks[i - 1] > limit){
        if(!burst || i - 1 - s > burst[1] - burst[0]) burst = [s, i - 1];
        s = i;
      }
    }
    if(burst[1] === burst[0]) burst = null;
  }
  if(burst){
    const d = []; for(let i = burst[0] + 1; i <= burst[1]; i++) d.push(peaks[i] - peaks[i - 1]);
    const rps = 1 / median(d);
    $('#rps').textContent = rps.toFixed(1); $('#rps').classList.remove('idle');
    $('#rpm').textContent = Math.round(rps * 60);
    $('#shots').textContent = burst[1] - burst[0] + 1;
    setStatus('LOCKED', 'ok');
  }else{
    setStatus('NO BURST');
  }
  $('#wlabel').textContent = dur.toFixed(2) + 's';
  drawWave();
}

/* ---------- 描画 ---------- */
function prep(c){
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  return [g, W, H];
}
function scopeGrid(g, W, H){
  g.strokeStyle = cssVar('--line'); g.lineWidth = 1;
  for(let i = 1; i < 10; i++){ const x = Math.round(W * i / 10) + .5; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for(let i = 1; i < 4; i++){ const y = Math.round(H * i / 4) + .5; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
}

function drawWave(){
  const [g, W, H] = prep($('#wave'));
  scopeGrid(g, W, H);
  const mid = H / 2;
  if(!env){
    g.strokeStyle = cssVar('--dim'); g.beginPath(); g.moveTo(0, mid); g.lineTo(W, mid); g.stroke();
    return;
  }
  const scale = (mid - 6) / (envMax || 1), hi = cssVar('--hi');
  const t2x = t => t / dur * W;
  if(burst){
    const x0 = t2x(peaks[burst[0]]), x1 = t2x(peaks[burst[1]]);
    g.fillStyle = 'rgba(124,255,107,.08)'; g.fillRect(x0, 0, x1 - x0, H);
    g.strokeStyle = cssVar('--amber'); g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(x0 + .5, 0); g.lineTo(x0 + .5, H); g.moveTo(x1 + .5, 0); g.lineTo(x1 + .5, H); g.stroke(); g.setLineDash([]);
  }
  g.fillStyle = hi; g.shadowColor = hi; g.shadowBlur = 6;
  for(let x = 0; x < W; x++){
    const a = Math.floor(x / W * env.length), b = Math.max(a + 1, Math.floor((x + 1) / W * env.length));
    let m = 0; for(let i = a; i < b && i < env.length; i++) if(env[i] > m) m = env[i];
    const hh = Math.max(.5, m * scale); g.fillRect(x, mid - hh, 1, hh * 2);
  }
  g.shadowBlur = 0;
  // 発射マーカー
  for(let k = 0; k < peaks.length; k++){
    const inB = burst && k >= burst[0] && k <= burst[1];
    const x = Math.round(t2x(peaks[k])) + .5;
    g.strokeStyle = inB ? cssVar('--red') : cssVar('--dim'); g.globalAlpha = inB ? .8 : .6;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 7); g.moveTo(x, H - 7); g.lineTo(x, H); g.stroke();
  }
  g.globalAlpha = 1;
}

// 録音中のライブ表示（スクロールする音量バー）
function liveLoop(){
  analyser.getFloatTimeDomainData(liveBuf);
  let m = 0; for(const v of liveBuf){ const a = v < 0 ? -v : v; if(a > m) m = a; }
  liveHist.push(m);
  const [g, W, H] = prep($('#wave'));
  scopeGrid(g, W, H);
  const mid = H / 2, cols = Math.floor(W / 3), start = Math.max(0, liveHist.length - cols);
  const red = cssVar('--red'), hi = cssVar('--hi');
  g.shadowBlur = 6;
  for(let i = start; i < liveHist.length; i++){
    const v = Math.min(1, liveHist[i]), hh = Math.max(.5, v * (mid - 4)), x = (i - start) * 3;
    g.fillStyle = g.shadowColor = v > .98 ? red : hi;
    g.fillRect(x, mid - hh, 2, hh * 2);
  }
  g.shadowBlur = 0;
  liveRAF = requestAnimationFrame(liveLoop);
}

window.addEventListener('resize', () => { if(!(mediaRec && mediaRec.state === 'recording')) drawWave(); });
drawWave();
</script>
</body>
</html>
